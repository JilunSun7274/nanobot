# Nanobot - Aliyun HK Deployment
# 阿里云香港轻量服务器（2 vCPU / 1 GB RAM）专用配置
#
# 镜像来源：由 GitHub Actions 构建并推送到 ACR，服务器只做 pull
# 镜像地址：通过 ACR_REGISTRY 环境变量注入（存放在 .env 文件）
#
# 使用方式：
#   cp .env.example .env && vim .env   # 填入密钥和 ACR 地址
#   docker compose pull                # 拉取最新镜像
#   docker compose up -d               # 启动
#   docker compose logs -f             # 查看日志

x-common: &common
  image: ${ACR_REGISTRY}/nanobot:latest   # 从 ACR 拉取，由 .env 注入地址
  volumes:
    - ./data/.nanobot:/home/nanobot/.nanobot
  env_file: .env
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined
  restart: unless-stopped

services:
  nanobot-gateway:
    <<: *common
    container_name: nanobot-gateway
    command: ["gateway"]
    ports:
      - "127.0.0.1:18790:18790"   # 仅绑定本机，不暴露公网
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M            # 1GB RAM 服务器，留余量给系统
        reservations:
          cpus: "0.1"
          memory: 256M

  # CLI 工具容器（按需执行，不常驻）
  nanobot-cli:
    <<: *common
    container_name: nanobot-cli
    profiles:
      - cli
    restart: "no"
    stdin_open: true
    tty: true
    command: ["status"]
