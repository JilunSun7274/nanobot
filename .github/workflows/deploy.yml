name: Deploy to Aliyun HK

# 触发条件：main 分支 push，且以下路径有变动
# 文档/测试改动不触发部署
on:
  push:
    branches: [main]
    paths:
      - "nanobot/**"
      - "bridge/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "entrypoint.sh"
      - "deploy/aliyun/**"

env:
  DEPLOY_DIR: /opt/nanobot/deploy/aliyun

jobs:
  # ── Job 1: 测试（与 ci.yml 对齐，只跑 Linux/3.12 加快速度） ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check nanobot --select F401,F841

      - name: Run tests
        run: uv run pytest tests/

  # ── Job 2: 构建镜像并推送 ACR ────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      # BuildKit 支持（--cache-from/--cache-to 需要 buildx）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录阿里云 ACR
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 生成镜像 tag（latest + git SHA，方便版本追溯）
      - name: Generate image tags
        id: meta
        run: |
          IMAGE=${{ secrets.ACR_REGISTRY }}/nanobot
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tags=${IMAGE}:latest,${IMAGE}:${{ github.sha }}" >> $GITHUB_OUTPUT

      # 构建 + 推送（使用 Registry 缓存，解决 CI Runner 无本地缓存的问题）
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY }}/nanobot:buildcache
          cache-to: type=registry,ref=${{ secrets.ACR_REGISTRY }}/nanobot:buildcache,mode=max
          # mode=max：导出所有中间层，最大化缓存复用
          # mode=min（默认）：只导出最终层，第一次之后慢步骤仍会重建

  # ── Job 3: 部署到阿里云服务器 ────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 写入 SSH 私钥（Runner 内存，workflow 结束后销毁）
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ALIYUN_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 预存服务器指纹，避免交互式确认
          ssh-keyscan -H "${{ secrets.ALIYUN_HOST }}" >> ~/.ssh/known_hosts

      # SSH 到服务器：拉镜像 + 滚动重启
      # heredoc 定界符加单引号：内容不在 Runner 本地展开，在服务器端展开
      - name: Pull image and restart
        run: |
          ssh nanobot@${{ secrets.ALIYUN_HOST }} bash << 'REMOTE'
            set -euo pipefail
            cd /opt/nanobot/deploy/aliyun

            echo "=== 登录 ACR ==="
            echo "${ACR_PASSWORD}" | docker login "${ACR_REGISTRY}" \
              -u "${ACR_USERNAME}" --password-stdin

            echo "=== 拉取最新镜像 ==="
            docker compose pull nanobot-gateway

            echo "=== 滚动重启（强制重建容器，不依赖镜像 SHA 对比） ==="
            docker compose up -d --no-deps --force-recreate nanobot-gateway

            echo "=== 清理旧镜像 ==="
            docker image prune -f
          REMOTE
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      # 健康检查：双重验证（容器状态 + HTTP）
      - name: Health check
        run: |
          ssh nanobot@${{ secrets.ALIYUN_HOST }} bash << 'REMOTE'
            set -euo pipefail

            echo "=== 等待容器稳定（最多 30 秒）==="
            for i in $(seq 1 10); do
              status=$(docker inspect --format='{{.State.Status}}' nanobot-gateway 2>/dev/null || echo "missing")
              if [ "$status" = "running" ]; then
                echo "容器状态：running（第 ${i} 次检查）"
                break
              elif [ "$status" = "restarting" ]; then
                echo "容器重启中，等待... (${i}/10)"
                sleep 3
              else
                echo "容器状态异常：${status}"
                docker compose -f /opt/nanobot/deploy/aliyun/docker-compose.yml logs --tail=50 nanobot-gateway
                exit 1
              fi
              [ "$i" -eq 10 ] && { echo "超时：容器未能在 30 秒内稳定"; exit 1; }
            done

            echo "=== 延迟崩溃检测（再等 5 秒）==="
            sleep 5
            status=$(docker inspect --format='{{.State.Status}}' nanobot-gateway)
            if [ "$status" != "running" ]; then
              echo "延迟崩溃：容器在稳定后再次退出，状态：${status}"
              docker compose -f /opt/nanobot/deploy/aliyun/docker-compose.yml logs --tail=50 nanobot-gateway
              exit 1
            fi

            echo "=== HTTP 健康检查 ==="
            curl -sf http://127.0.0.1:18790/health || {
              echo "health endpoint 无响应"
              exit 1
            }

            echo "✓ 部署验证通过"
          REMOTE

      # 部署失败时输出日志链接（方便快速定位）
      - name: Report failure
        if: failure()
        run: |
          echo "部署失败，查看完整日志："
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
